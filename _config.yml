# main text of home
name: Aryan Saini
bio: Undergraduate Researcher at Weave Lab, IIIT Delhi.

# twitter summary info
description: I am an undergradute student at Indraprastha Institute of Information Technology, Delhi pursuing my Bachelor’s Degree in Technology with Electronics and Communication being my major.

I have always been actively involved in projects which may help in solving real life problems. I like to design and prototype interactive systems that enhance the interaction between computer systems and humans.

My undergraduate thesis labelled “Designing wearable toolkits and trinkets” is being advised by Dr. Aman Parnami and I’m an active member of the Weave Lab.

